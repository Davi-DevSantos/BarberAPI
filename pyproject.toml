[project]
name = "barberapi"
version = "0.1.0"
description = "A Barber shop API"
authors = [
    {name = "Davx",email = "devsantos.davi@gmail.com"}
]
license = "n"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
